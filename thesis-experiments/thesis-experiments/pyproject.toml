[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallucination-eval"
version = "0.1.0"
description = "Shared model-agnostic code for RS object-hallucination detection experiments (thesis 5.1-5.3)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
metrics = ["scikit-learn"]
plots = ["matplotlib", "seaborn", "pandas"]
dev = ["pytest", "scikit-learn"]

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "gpu: requires a GPU and a model-specific uv environment (run via SLURM)",
]
